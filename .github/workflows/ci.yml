name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The latest Bun, and the oldest codex-collab says it runs on
        # (package.json's engines.bun), so that the number stays true.
        bun: [latest, "1.3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Install codex CLI
        run: npm install -g @openai/codex

      - name: Smoke-test installer (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./install.sh
          codex-collab --help
          codex-collab health

      - name: Smoke-test installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          $installer = Join-Path $PWD 'install.ps1'
          $workDir = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'codex-collab-install')
          Push-Location $workDir.FullName
          try {
            $env:CODEX_COLLAB_CODEX_SKILL_DIR = 'relative-codex-skill'
            & $installer
            $skill = Join-Path $PWD "$env:CODEX_COLLAB_CODEX_SKILL_DIR\SKILL.md"
            if ((Get-Content -LiteralPath $skill -Raw) -notmatch '(?m)^name: claude-collab\r?$') {
              throw "Expected the Codex skill at $skill"
            }
            codex-collab --help
            codex-collab health
          } finally {
            Pop-Location
          }

      - name: Smoke-test .cmd shim from CMD (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          REM Simulate new terminal: reload PATH from registry, keep session PATH for bun/node
          for /f "delims=" %%i in ('powershell -Command "[Environment]::GetEnvironmentVariable('Path','User') + ';' + [Environment]::GetEnvironmentVariable('Path','Machine')"') do set "PATH=%%i;%PATH%"
          codex-collab --help
          codex-collab health
